<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
    <title>Лаба 3</title>
</head>

<body class="d-flex flex-column min-vh-100">

    <header>
        <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
            <div class="collapse navbar-collapse" id="navbarSupportedContent">
                <ul class="navbar-nav ms-3 mb-2 mb-lg-0">

                    <li class="nav-item">
                        <a class="nav-link" href="{{ url_for('index') }}">Индекс</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="{{ url_for('counter') }}">Счетчик посещений</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="{{ url_for('auth') }}">Войти</a>
                    </li>
                    {% if current_user.is_authenticated %}
                    <li class="nav-item">
                        <a class="nav-link" href="{{ url_for('secret') }}">Секретная страница</a>
                    </li>
                    {% endif %}

                </ul>
            </div>
        </nav>
    </header>

    <main>

        <div class="container pt-5">
            {% block content %}
            <h1>=＾• ⋏ •＾=</h1>
            {% endblock %}
            <h3>{{ hi_user }}</h3>
        </div>

    </main>

    <footer class="bg-dark text-light p-5 mt-auto">
        <div class="container text-center">
            <h4>Конарев Илья Александрович</h4>
            <h6>241-327</h6>
        </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-MrcW6ZMFYlzcLA8Nl+NtUVF0sA7MsXsP1UyJoMp4YLEuNSfAP+JcXn/tWtIaxVXM"
        crossorigin="anonymous"></script>

</body>

</html>
