{% extends 'base.html' %}

{% block content %}

{% if request.args.get('error') == 'need_auth' %}
    <h5 class="text-danger text-center mb-3"> Для доступа к данной странице необходимо авторизоваться!!!</h5>
{% endif %}

<form action="/auth" method="post" class="bg-light p-4 m-auto mb-5 rounded shadow border border-2"
    style="max-width: 500px;">
    <h4 class="mb-4">Авторизация</h4>
    <label for="" class="form-label">Логин</label>
    <input type="text" name="login" class="form-control mb-2" required>

    <label for="" class="form-label">Пароль</label>
    <input type="password" name="password" class="form-control mb-2" required>

    <input type="hidden" name="next" value="{{ request.args.get('next', '') }}">

    <div class="form-check mb-3">
        <label for="" class="form-check-label">Запомнить меня</label>
        <input type="checkbox" name="remember_me" id="" class="form-check-input">
    </div>

    {% if error == "not_log_pass" %}
        <p class="text-danger">Неверный логин или пароль</p>
    {% endif %}

    <button type="submit" class="btn btn-primary">Войти</button>
</form>
<hr>
<p>Логин пароль: user qwerty</p>

{% endblock %}
